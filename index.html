<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Kurgu Canavarı OTO-PILOT</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0b0f19; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 15px; min-height: 100vh; }
    
    h1 { font-size: 1.8rem; font-weight: 800; background: linear-gradient(90deg, #3b82f6, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; margin-bottom: 2px; }
    p.sub { color: #94a3b8; font-size: 0.85rem; margin-bottom: 15px; text-align: center; }

    .panel-card { background: #111827; border: 1px solid #1e293b; border-radius: 10px; padding: 12px; width: 100%; max-width: 900px; margin-bottom: 10px; }
    .panel-title { font-size: 0.75rem; color: #a855f7; font-weight: bold; letter-spacing: 1px; margin-bottom: 8px; text-transform: uppercase; }

    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }

    label.field-label { display: block; font-size: 0.7rem; color: #94a3b8; margin-bottom: 4px; font-weight: 600; }
    select, input[type="text"] { width: 100%; background: #1e293b; border: 1px solid #334155; color: #fff; padding: 8px; border-radius: 6px; outline: none; font-size: 0.85rem; }

    .subtitle-styles { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 5px; }
    .sub-btn { background: #1e293b; border: 2px solid #334155; border-radius: 6px; padding: 6px 4px; text-align: center; cursor: pointer; font-size: 0.75rem; font-weight: bold; transition: 0.2s; user-select: none; }
    .sub-btn.active { border-color: #a855f7; background: #a855f720; color: #a855f7; }

    .preview-box { width: 100%; max-width: 900px; background: #111827; border: 1px solid #1e293b; border-radius: 10px; overflow: hidden; margin-bottom: 10px; display: flex; justify-content: center; }
    canvas { width: 100%; max-height: 280px; object-fit: contain; display: block; background: #000; }

    .action-row { display: flex; gap: 10px; width: 100%; max-width: 900px; margin-bottom: 10px; }
    .btn-submit { flex: 1; background: linear-gradient(90deg, #3b82f6, #a855f7); border: none; color: white; padding: 14px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
    .btn-submit:hover { opacity: 0.95; }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    .counter-bar { width: 60px; background: #111827; border: 2px solid #a855f7; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 1.3rem; font-weight: 800; color: #38bdf8; }

    #status { color: #38bdf8; font-weight: 600; font-size: 0.85rem; text-align: center; background: #1e293b; padding: 10px; border-radius: 6px; width: 100%; max-width: 900px; word-break: break-all; }
  </style>
</head>
<body>

  <h1>Kurgu Canavarı OTO-PILOT</h1>
  <p class="sub">Tüm Kategoriler İçin Çok Amaçlı Otomatik YouTube Shorts Üretici</p>

  <div class="panel-card">
    <div class="panel-title">1. İÇERİK VE KATEGORİ SEÇİMİ</div>
    <div class="grid-3">
      <div>
        <label class="field-label">Ana Kategori</label>
        <select id="categorySelect">
          <option value="Dini ve Manevi Bilgiler">🕌 Dini & Manevi Bilgiler</option>
          <option value="Ilginç Bilgiler">💡 İlginç Bilgiler & Şaşırtıcı Gerçekler</option>
          <option value="Dunya ve Turk Tarihi">📜 Dünya & Türk Tarihi</option>
          <option value="Bilim ve Teknoloji">🚀 Bilim, Teknoloji & Uzay</option>
          <option value="Motivasyon">🔥 Motivasyon & Başarı Hikayeleri</option>
          <option value="Psikoloji">🧠 Psikoloji & Zihin Gerçekleri</option>
        </select>
      </div>
      <div>
        <label class="field-label">Özel Konu / Detay (Opsiyonel)</label>
        <input type="text" id="customTopicInput" placeholder="Örn: Karadelikler, Fatih Sultan Mehmet..." />
      </div>
      <div>
        <label class="field-label">Google Cloud API Key</label>
        <input type="text" id="apiKeyInput" value="AIzaSyDlKGg2a5-Jg-A-nt0dND41fAbPB51YRZ0" />
      </div>
    </div>
  </div>

  <div class="panel-card">
    <div class="panel-title">2. VİDEO VE ALTYAZI AYARLARI</div>
    <div class="grid-4">
      <div>
        <label class="field-label">Çözünürlük</label>
        <select id="resolution">
          <option value="1080x1920" selected>Dikey Shorts • 1080×1920</option>
          <option value="1920x1080">Yatay HD • 1920×1080</option>
        </select>
      </div>
      <div>
        <label class="field-label">Video Süresi</label>
        <select id="durationSelect">
          <option value="15" selected>15 Saniye (Hızlı)</option>
          <option value="30">30 Saniye (Uzun Shorts)</option>
          <option value="60">60 Saniye (Tam Boyut)</option>
        </select>
      </div>
      <div>
        <label class="field-label">Altyazı Boyutu</label>
        <select id="subSize">
          <option value="medium" selected>Orta</option>
          <option value="large">Büyük</option>
        </select>
      </div>
      <div>
        <label class="field-label">FPS Modu</label>
        <select id="fpsSelect">
          <option value="30">30 FPS (Dengeli)</option>
          <option value="60">60 FPS (Pürüzsüz)</option>
        </select>
      </div>
    </div>

    <div class="panel-title" style="margin-top: 8px;">ALTYAZI TEMA STİLİ</div>
    <div class="subtitle-styles">
      <div class="sub-btn active" onclick="setSubStyle('yellow', this)">Sarı Vurgu</div>
      <div class="sub-btn" onclick="setSubStyle('neon', this)">Neon Mor</div>
      <div class="sub-btn" onclick="setSubStyle('box', this)">Koyu Kutu</div>
      <div class="sub-btn" onclick="setSubStyle('cinema', this)">Sinema</div>
      <div class="sub-btn" onclick="setSubStyle('classic', this)">Klasik</div>
      <div class="sub-btn" onclick="setSubStyle('minimal', this)">Minimal</div>
    </div>
  </div>

  <div class="preview-box">
    <canvas id="renderCanvas" width="1080" height="1920"></canvas>
  </div>

  <div class="action-row">
    <button class="btn-submit" id="autoStartBtn" onclick="startGeneration()">🚀 VİDEO VE SESİ İNDİR</button>
    <div class="counter-bar" id="stepCounter">0</div>
  </div>
  
  <div id="status">Hazır. Üretimi başlatmak için butona basın.</div>

  <script>
    let selectedSubStyle = 'yellow';

    function setSubStyle(style, el) {
      document.querySelectorAll('.sub-btn').forEach(function(b) { b.classList.remove('active'); });
      el.classList.add('active');
      selectedSubStyle = style;
    }

    function wrapText(ctx, text, maxWidth) {
      const words = text.split(' ');
      const lines = [];
      let currentLine = words[0] || '';
      for (let i = 1; i < words.length; i++) {
        const word = words[i];
        if (ctx.measureText(currentLine + ' ' + word).width < maxWidth) {
          currentLine += ' ' + word;
        } else {
          lines.push(currentLine);
          currentLine = word;
        }
      }
      lines.push(currentLine);
      return lines;
    }

    function fetchHDImage(sig) {
      return new Promise(function(resolve) {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.src = "https://picsum.photos/1080/1920?random=" + sig;
        img.onload = function() { resolve(img); };
        img.onerror = function() {
          const c = document.createElement('canvas');
          c.width = 1080; c.height = 1920;
          const ctx = c.getContext('2d');
          ctx.fillStyle = '#0f172a';
          ctx.fillRect(0, 0, 1080, 1920);
          const fallbackImg = new Image();
          fallbackImg.src = c.toDataURL();
          fallbackImg.onload = function() { resolve(fallbackImg); };
        };
      });
    }

    function downloadGoogleSpeechMP3(text, apiKey) {
      return new Promise(function(resolve, reject) {
        const controller = new AbortController();
        const timeoutId = setTimeout(function() { controller.abort(); }, 4000); // 4 saniye zaman aşımı

        const url = "https://texttospeech.googleapis.com/v1/text:synthesize?key=" + apiKey;
        fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          signal: controller.signal,
          body: JSON.stringify({
            input: { text: text },
            voice: { languageCode: 'tr-TR', name: 'tr-TR-Standard-A' },
            audioConfig: { audioEncoding: 'MP3' }
          })
        })
        .then(function(res) { return res.json(); })
        .then(function(data) {
          clearTimeout(timeoutId);
          if (!data || !data.audioContent) {
            reject(new Error(data && data.error ? data.error.message : "Google TTS Ses Verisi Boş"));
            return;
          }
          const binaryString = atob(data.audioContent);
          const len = binaryString.length;
          const bytes = new Uint8Array(len);
          for (let i = 0; i < len; i++) {
            bytes[i] = binaryString.charCodeAt(i);
          }
          const blob = new Blob([bytes.buffer], { type: 'audio/mp3' });
          const audioUrl = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = audioUrl;
          a.download = "seslendirme_" + Date.now() + ".mp3";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          resolve(true);
        })
        .catch(function(err) {
          clearTimeout(timeoutId);
          reject(err);
        });
      });
    }

    async function startGeneration() {
      const btn = document.getElementById('autoStartBtn');
      const status = document.getElementById('status');
      const counter = document.getElementById('stepCounter');
      const category = document.getElementById('categorySelect').value;
      const customTopic = document.getElementById('customTopicInput').value.trim();
      const apiKey = document.getElementById('apiKeyInput').value.trim();
      const totalDuration = parseInt(document.getElementById('durationSelect').value);
      const finalTopic = customTopic !== "" ? customTopic : category;

      btn.disabled = true;

      try {
        counter.innerText = "1";
        status.innerHTML = "⏳ <b>[1/4] Metin Hazırlanıyor...</b>";

        const scenes = [
          { subtitle: finalTopic + " Hakkinda Sasirtici Gercekler" },
          { subtitle: "Gecmistten gunumuze gelen en gizemli detaylar." },
          { subtitle: "Bilimin ve tarihin arkasindaki sakli sirlar." },
          { subtitle: "Bu gercekler bakis acinizi tamamen degistirecek." },
          { subtitle: "Herkesin merak ettigi o buyuleyici konular." },
          { subtitle: "Daha fazla icerik icin takip etmeyi unutmayin!" }
        ];

        counter.innerText = "2";
        status.innerHTML = "🖼️ <b>[2/4] HD Görseller Yükleniyor...</b>";

        const loadedImages = [];
        for (let i = 0; i < scenes.length; i++) {
          const img = await fetchHDImage(Math.floor(Math.random() * 5000) + i);
          loadedImages.push({ scene: scenes[i], img: img });
        }

        counter.innerText = "3";
        status.innerHTML = "🎙️ <b>[3/4] MP3 Ses Dosyası İndiriliyor...</b>";

        const fullText = scenes.map(function(s) { return s.subtitle; }).join('. ');

        try {
          await downloadGoogleSpeechMP3(fullText, apiKey);
        } catch (audioErr) {
          console.warn("Ses hatasi detay:", audioErr);
          status.innerHTML = "⚠️ Ses Uyarısı: " + audioErr.message + " (Video render başlatıldı...)";
        }

        const canvas = document.getElementById('renderCanvas');
        const resParts = document.getElementById('resolution').value.split('x');
        canvas.width = parseInt(resParts[0]);
        canvas.height = parseInt(resParts[1]);
        const ctx = canvas.getContext('2d');

        const fps = parseInt(document.getElementById('fpsSelect').value);
        const canvasStream = canvas.captureStream(fps);

        let options = { mimeType: 'video/webm' };
        if (MediaRecorder.isTypeSupported('video/mp4')) {
          options = { mimeType: 'video/mp4' };
        }

        const recorder = new MediaRecorder(canvasStream, options);
        const chunks = [];
        recorder.ondataavailable = function(e) { chunks.push(e.data); };

        recorder.onstop = function() {
          const blob = new Blob(chunks, { type: options.mimeType });
          const videoUrl = URL.createObjectURL(blob);

          const a = document.createElement('a');
          a.href = videoUrl;
          a.download = "video_" + Date.now() + ".mp4";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);

          counter.innerText = "0";
          status.innerHTML = "🎉 <b>[4/4] Tamamlandı:</b> İndirmeler Başlatıldı!";
          btn.disabled = false;
        };

        recorder.start();

        counter.innerText = "4";
        const startTime = Date.now();
        const sceneDuration = totalDuration / scenes.length;

        function drawSubtitle(text) {
          ctx.save();
          let fontSize = canvas.height * 0.045;
          ctx.font = "bold " + fontSize + "px 'Segoe UI', sans-serif";
          ctx.textAlign = 'center';
          const lines = wrapText(ctx, text, canvas.width * 0.85);
          const startY = canvas.height * 0.75;

          lines.forEach(function(line, idx) {
            let yPos = startY + (idx * fontSize * 1.3);
            if (selectedSubStyle === 'yellow') {
              ctx.fillStyle = '#facc15';
              ctx.strokeStyle = '#000000';
              ctx.lineWidth = 8;
              ctx.strokeText(line, canvas.width / 2, yPos);
              ctx.fillText(line, canvas.width / 2, yPos);
            } else if (selectedSubStyle === 'neon') {
              ctx.shadowColor = '#a855f7';
              ctx.shadowBlur = 20;
              ctx.fillStyle = '#ffffff';
              ctx.fillText(line, canvas.width / 2, yPos);
            } else if (selectedSubStyle === 'box') {
              ctx.fillStyle = '#000000c0';
              const textWidth = ctx.measureText(line).width;
              ctx.fillRect((canvas.width - textWidth) / 2 - 10, yPos - fontSize + 5, textWidth + 20, fontSize + 10);
              ctx.fillStyle = '#ffffff';
              ctx.fillText(line, canvas.width / 2, yPos);
            } else {
              ctx.fillStyle = '#ffffff';
              ctx.strokeStyle = '#000000';
              ctx.lineWidth = 6;
              ctx.strokeText(line, canvas.width / 2, yPos);
              ctx.fillText(line, canvas.width / 2, yPos);
            }
          });
          ctx.restore();
        }

        function animate() {
          const elapsed = (Date.now() - startTime) / 1000;

          if (elapsed >= totalDuration) {
            if (recorder && recorder.state !== 'inactive') recorder.stop();
            return;
          }

          status.innerHTML = "🎬 <b>[4/4] Render Alınıyor:</b> " + elapsed.toFixed(1) + "s / " + totalDuration + "s...";

          const sceneIndex = Math.min(Math.floor(elapsed / sceneDuration), loadedImages.length - 1);
          const currentData = loadedImages[sceneIndex];

          ctx.fillStyle = "#000";
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          if (currentData && currentData.img) {
            ctx.save();
            const sceneElapsed = elapsed % sceneDuration;
            const scale = 1.0 + (sceneElapsed * 0.025);
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.scale(scale, scale);
            ctx.drawImage(currentData.img, -canvas.width / 2, -canvas.height / 2, canvas.width, canvas.height);
            ctx.restore();

            drawSubtitle(currentData.scene.subtitle);
          }

          requestAnimationFrame(animate);
        }

        animate();

      } catch (e) {
        counter.innerText = "0";
        status.innerHTML = "❌ Hata: " + e.message;
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
